<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel — презентация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aura"></div>
  <section class="panel" id="panel">
    <div class="top">
      <div class="pills"><span>Excel</span><span>Таблицы</span><span>Формулы</span><span>Аналитика</span></div>
      <span class="pill-count" id="count">1 / 10</span>
    </div>
    <div id="slide" class="slide"></div>
    <div class="ctrl">
      <button id="prev" class="btn ghost">← назад</button>
      <button id="next" class="btn">дальше →</button>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
